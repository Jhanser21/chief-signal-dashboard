services:
  - type: web
    name: chief-signal-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SEND_TELEGRAM
        value: "false"
      - key: SEND_DISCORD
        value: "false"
